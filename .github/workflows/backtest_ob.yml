name: Backtest OB

on:
  schedule:
    - cron: "0 2 * * 0"      # tiap Minggu 09:00 WIB
  workflow_dispatch:         # tombol "Run workflow" untuk jalan manual

permissions:
  contents: write            # untuk menyimpan backtest_ob_stats.json

concurrency:
  group: backtest-ob
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: Jalankan uji Order Block dan divergence
        run: python backtest_ob.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Simpan hasil
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add backtest_ob_stats.json || true
          git commit -m "update backtest ob" || exit 0
          git pull --rebase || true
          git push || true
