name: Backtest

on:
  schedule:
    - cron: "0 1 * * 0"      # tiap Minggu 08:00 WIB
  workflow_dispatch:         # tombol "Run workflow" untuk jalan manual

permissions:
  contents: write            # untuk menyimpan backtest_stats.json

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: Jalankan backtest
        run: python backtest.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Jalankan uji koin bangun tidur
        run: python backtest_vol.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Simpan hasil
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add backtest_stats.json backtest_vol_stats.json || true
          git commit -m "update backtest" || exit 0
          git pull --rebase || true
          git push || true
