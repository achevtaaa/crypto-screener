name: Screener

on:
  schedule:
    # 07:05 dan 19:05 WIB (UTC+7) = 00:05 dan 12:05 UTC
    - cron: "5 0,12 * * *"
  workflow_dispatch: {}

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang font Inter
        run: sudo apt-get update && sudo apt-get install -y fonts-inter

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Jalankan screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python screener.py
